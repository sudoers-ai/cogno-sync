[project]
name = "cogno-sync"
version = "0.1.0"
description = "Distributed coordination primitives for the Cogno stack — async lock, token-bucket rate limiter, claim-once idempotency store and rolling daily cap, each with an in-process default and a Redis adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Vale" }]
maintainers = [{ name = "Sudoers AI" }]
keywords = ["redis", "distributed-lock", "rate-limiting", "token-bucket", "idempotency", "quota", "asgi", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Zero hard dependencies: the in-process defaults are stdlib-only. Redis and Starlette are
# lazy-imported behind the extras below, so importing this package needs neither.
dependencies = []

[project.urls]
Homepage = "https://github.com/sudoers-ai/cogno-sync"
Repository = "https://github.com/sudoers-ai/cogno-sync"
Issues = "https://github.com/sudoers-ai/cogno-sync/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]
asgi = ["starlette>=0.36"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "redis>=5.0",       # the Redis adapters' own tests use fakes; this covers client_from_url
    "starlette>=0.36",  # the ASGI middleware + body-cap tests
    "httpx>=0.24",      # starlette.testclient
    "ruff>=0.5",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogno_sync*"]

[tool.setuptools.package-data]
cogno_sync = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["cogno_sync"]
warn_unused_ignores = true
