name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per workflow per ref. A push that supersedes a still-running run cancels it
# instead of paying for both: measured over 30 days on cogno-host, 1526 of 3016 billed CI minutes
# (51%) went to runs a newer push had already made obsolete.
#
# The key is WORKFLOW + ref, not ref alone. A ref-only group would put this workflow and the
# publish workflow beside it into the SAME group on a push to main, so a release could cancel CI,
# or CI a release. A group is a lane; two workflows that mean different things do not share one.
#
# `main` is EXEMPT from cancellation, deliberately. A push to main is a commit nobody will
# re-push, so cancelling its run leaves that commit with no verdict at all — and main is the ref
# a release tag is cut from. On main the group still SERIALISES (a second run queues behind the
# first) rather than cancelling: the waste this exists to stop is iterating on a PR, not merging,
# and merges are already serialised by review. On a pull_request event github.ref is
# refs/pull/<n>/merge, never refs/heads/main, so PR runs always cancel — which is where the 51%
# is. The cost of the exemption is therefore close to zero and it buys back a per-commit verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_sync tests examples
      - name: Type-check (mypy)
        run: mypy cogno_sync
      - name: Unit tests
        # Redis adapters run against fake clients here; no server needed.
        run: pytest tests/unit -q --cov=cogno_sync --cov-report=term-missing --cov-fail-under=90

  redis:
    # The properties only a real server can show: two clients sharing one bucket, the claim that
    # survives across connections, the TTL Redis itself holds.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests (real Redis)
        env:
          COGNO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/integration -q
