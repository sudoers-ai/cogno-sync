name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_sync tests examples
      - name: Type-check (mypy)
        run: mypy cogno_sync
      - name: Unit tests
        # Redis adapters run against fake clients here; no server needed.
        run: pytest tests/unit -q --cov=cogno_sync --cov-report=term-missing --cov-fail-under=90

  redis:
    # The properties only a real server can show: two clients sharing one bucket, the claim that
    # survives across connections, the TTL Redis itself holds.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests (real Redis)
        env:
          COGNO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/integration -q
